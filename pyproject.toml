[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-scraper"
version = "0.1.0"
description = "Scrape a Discord channel into SQLite and analyse it from the CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["discord", "sqlite", "scraper", "statistics", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
  "Topic :: Database :: Front-Ends",
]

# The tool is deliberately dependency-free: the scraper speaks HTTP with urllib
# from the standard library. The dashboard that renders the rollups lives in
# discord-message-stats and owns FastAPI, uvicorn and the rest.
dependencies = []

[project.urls]
Documentation = "https://github.com/BobbyNooby/discord-message-scraper#readme"
Source = "https://github.com/BobbyNooby/discord-message-scraper"

[project.optional-dependencies]
# httpx is test-only: the suite fakes Discord's REST calls with MockTransport.
dev = ["pytest", "httpx"]

[project.scripts]
discord-scraper = "discord_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The stopword corpora are read at runtime.
discord_scraper = ["data/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
